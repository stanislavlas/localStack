name: "DynamoDB Local"
description: "Amazon DynamoDB Local — persistent DynamoDB for Moni app. Data survives restarts."
# Bump version on every push so HA shows "Update available" in the add-on store.
# Use MAJOR.MINOR.PATCH: patch for bug fixes, minor for new features.
version: "2.0.0"
slug: "localstack"
init: false
host_network: true
arch:
  - aarch64
  - amd64
ports:
  4566/tcp: 4566
ports_description:
  4566/tcp: "DynamoDB endpoint"
map:
  - data
options: {}
schema: {}
